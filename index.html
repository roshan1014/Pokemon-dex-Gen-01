<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="left">
          <div class="logo">
            <img src="assets/download-Photoroom (1).png" alt="Pokemon Logo" />
          </div>

          <div class="content">
            <small class="pock">POKEMON GEN |</small>
            <h1 class="heading">Pikachu</h1>
            <p>
              Pikachu is an Electric-type Pokémon introduced in Generation I.
              Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
              They are almost completely covered by yellow fur.
            </p>
            <div class="counter">
              <div class="horizontal"></div>
              <small class="num"> 01 / 08</small>
            </div>
          </div>

          <div class="pokoball">
            <img src="assets/pokemonball.png" alt="Pokemon ball image" />
          </div>
        </div>

        <div class="right">
          <div class="menu"><i class="ri-menu-line"></i></div>

          <div class="pockemonimg">
            <img src="assets/pikachu.png" alt="Pokemon Imgae">
          </div>

          <div class="sliderdot">
            <div class="dot1"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
